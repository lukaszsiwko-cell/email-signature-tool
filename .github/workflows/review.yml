name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ai-cr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      ${{
        (github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Run AI reviewer
        uses: ./
        id: review
        with:
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          openrouter-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ vars.OPENROUTER_MODEL }}

      - name: Fail check for a failing review verdict
        if: ${{ steps.review.outputs.verdict == 'fail' }}
        run: |
          echo "The AI reviewer returned a fail verdict."
          exit 1
